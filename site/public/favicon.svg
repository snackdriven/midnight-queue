<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Now Screaming">
  <!-- Solid plate rather than an outline: at 16px a stroke turns to mush, and the fill reads on
       both light and dark browser chrome. Eyes are deliberately mismatched and the face sits a
       few degrees off true, so it lands as alarm rather than a neutral emoji. -->
  <rect width="32" height="32" rx="7" fill="#5fd6dd"/>
  <g transform="rotate(-4 16 16)" fill="#12151e">
    <ellipse cx="10" cy="10.4" rx="2.1" ry="3.4"/>
    <ellipse cx="21.7" cy="9.4" rx="1.7" ry="2.8"/>
    <ellipse cx="16" cy="23" rx="4.2" ry="7.2"/>
  </g>
</svg>
